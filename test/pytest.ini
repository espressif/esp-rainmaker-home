[pytest]
addopts = --color=no
norecursedirs = firmwares *.egg-info .git
markers =
    sanity: quick happy-path checks run on every MR
    regression: full functional coverage
    provisioning: tests needing ESP hardware and firmware bundles
    testing: scratch marker for local debugging
    user_management: account suites (signup/login/password/third-party)
    third_party: Google/Apple OAuth sign-in suites
    on_network: on-network (mDNS) provisioning suite
    softap: SoftAP provisioning suite
    delete_account: account deletion suite
    change_password: change-password suite
    forgot_password: forgot-password suite
    device_control: device control suites
    scene: scene suites
    schedule: schedule suites
    automation: automation suites
    matter: Matter commissioning suite
    matter_only: Matter-only (esp-matter) commissioning scenario
    rmneo_matter: RMNEO+Matter (RainMaker+Matter) commissioning scenario
    rmneo_only: RMNEO-only scenarios, deselected on every other deployment
    group_sharing: group sharing suite
    sharing_management: primary-side sharing management UI (pending list, revoke)
log_level = INFO
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

