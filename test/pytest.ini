[pytest]
addopts = --color=no
norecursedirs = firmwares *.egg-info .git
markers =
    sanity: quick happy-path checks run on every MR
    regression: full functional coverage
    provisioning: tests needing ESP hardware and firmware bundles
    testing: scratch marker for local debugging
log_level = INFO
log_format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
log_date_format = %Y-%m-%d %H:%M:%S

