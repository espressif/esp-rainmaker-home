# GitLab CI/CD Pipeline for building ESP RainMaker Home App for Android and iOS and testing on Android devices.

stages:
  - quality
  - build
  - test
  - deploy
  - archive

variables:
  LANG: en_US.UTF-8
  LC_ALL: en_US.UTF-8

# Pipelines run in two contexts:
#   - MR pipelines: quality/build/test + OTA (manual) for pre-merge iteration.
#   - release/* branch push pipelines: OTA publish (auto) once a merge lands.
# auto_cancel: a re-push cancels the superseded pipeline's interruptible (build/quality) jobs.
workflow:
  auto_cancel:
    on_new_commit: interruptible
  rules:
    # Skip CI for draft merge requests (Draft:/WIP: title or draft flag).
    - if: '$CI_MERGE_REQUEST_DRAFT == "true"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TITLE =~ /^(Draft|WIP):/i'
      when: never
    - if: $CI_MERGE_REQUEST_ID
    # Main branch — quality-only runs (no MR required).
    - if: '$CI_COMMIT_BRANCH == "main"'
    # Release branches — auto-fire OTA publish and enable manual web publish.
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/


# AWS session credentials for web publish / S3 sync (GitLab CI/CD Variables).
.aws_web_credentials:
  script:
    - |
      set -euo pipefail
      : "${AWS_ACCESS_KEY_ID:?Set AWS_ACCESS_KEY_ID in CI/CD variables}"
      : "${AWS_SECRET_ACCESS_KEY:?Set AWS_SECRET_ACCESS_KEY in CI/CD variables}"
      : "${AWS_REGION:?Set AWS_REGION in CI/CD variables}"
      export AWS_REGION
      if [ -n "${AWS_SESSION_TOKEN:-}" ]; then
        export AWS_SESSION_TOKEN
      fi
      command -v aws >/dev/null 2>&1 || { echo "aws CLI not found on runner"; exit 1; }
      aws sts get-caller-identity


# Deployment/SDK select (orthogonal to the region APP_FLAVOR global/cn): ACTIVE_SDK (build) + DEPLOYMENT (test) from the commit message — contains "RMNEO" (any case) -> rmneo, else rm; a preset ACTIVE_SDK/DEPLOYMENT CI/CD variable overrides.
.select_deployment:
  script:
    - |
      if printf '%s' "${CI_COMMIT_MESSAGE:-${CI_COMMIT_TITLE:-}}" | grep -qi 'NEO'; then
        _sel_sdk="rainmaker-neo-base-sdk"; _sel_dep="rmneo"
      else
        _sel_sdk="rainmaker-matter-sdk"; _sel_dep="rm"
      fi
      export ACTIVE_SDK="${ACTIVE_SDK:-$_sel_sdk}"
      export DEPLOYMENT="${DEPLOYMENT:-$_sel_dep}"
      _sel_marker="sanity"
      if printf '%s' "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" | grep -q '^release/v'; then
        _sel_marker="regression"
      fi
      export MARKER="${MARKER:-$_sel_marker}"
      echo "Commit-message deployment select: ACTIVE_SDK=${ACTIVE_SDK} DEPLOYMENT=${DEPLOYMENT} MARKER=${MARKER}"


# Both build jobs bake the selected ACTIVE_SDK into the env file the app reads at build time.
.env_tools:
  script:
    - |
      inject_active_sdk() {
        local env_file="$1"
        if grep -qE '^ACTIVE_SDK=' "${env_file}"; then
          sed -i.bak -E "s|^ACTIVE_SDK=.*|ACTIVE_SDK=${ACTIVE_SDK}|" "${env_file}" && rm -f "${env_file}.bak"
        else
          printf '\nACTIVE_SDK=%s\n' "${ACTIVE_SDK}" >> "${env_file}"
        fi
        echo "ACTIVE_SDK=${ACTIVE_SDK} -> ${env_file}"
      }

      # Download all GitLab Secure Files for the project into .secure_files/.
      # Idempotent: skips when the dir is already populated.
      # Per-job TMPDIR + bin path so parallel jobs on the same runner (global +
      # cn android_apk) don't race on the installer's shared mv/exec paths.
      download_secure_files() {
        if [ -d ".secure_files" ] && [ -n "$(ls -A .secure_files 2>/dev/null)" ]; then
          return 0
        fi
        local sf_dir
        sf_dir="$(mktemp -d)"
        curl --silent --fail \
          "https://gitlab.com/gitlab-org/incubation-engineering/mobile-devops/download-secure-files/-/raw/main/installer" \
          | TMPDIR="${sf_dir}" bash -s -- "${sf_dir}/bin"
        rm -rf "${sf_dir}"
      }

      # Prefer the Secure File .env.<flavor>; fall back to the committed
      # .env.<flavor>.example. Then fill any missing/empty keys from that example
      # so secrets do not need updating for every new template key.
      resolve_ci_env() {
        local flavor="$1"
        local region_env=".env.${flavor}"
        local example_env=".env.${flavor}.example"
        local secure_env=".secure_files/${region_env}"

        download_secure_files

        if [ -f "${secure_env}" ]; then
          umask 077
          cp "${secure_env}" "${region_env}"
          echo "Using Secure File ${region_env}"
        elif [ -f "${example_env}" ]; then
          cp "${example_env}" "${region_env}"
          echo "WARN: Secure File ${region_env} missing; using ${example_env} as base"
        else
          echo "ERROR: Secure File ${region_env} unavailable and ${example_env} is missing"
          exit 1
        fi

        if [ -f "${example_env}" ]; then
          node scripts/merge-env-with-example.js "${region_env}" "${example_env}"
        fi

        cp "${region_env}" .env
        test -s .env
      }


# Decode the OTA manifest signing key — see deployment/ota/README.md for rotation.
.ota_signing_key:
  script:
    - |
      : "${OTA_SIGNING_KEY_PEM:?must be set (masked, protected). See deployment/ota/README.md.}"
      umask 077
      mkdir -p deployment/ota/certs
      printf '%s' "${OTA_SIGNING_KEY_PEM}" | base64 -d > deployment/ota/certs/private-key.pem
      test -s deployment/ota/certs/private-key.pem


before_script:
  - export PATH="/usr/local/opt/python@3.10/libexec/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
  - export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/tools:$ANDROID_HOME/tools/bin:$PATH"

  # Honor .nvmrc so the runner uses the exact Node the repo pins. Falls back
  # to the latest installed v22 if the pinned version isn't on the runner,
  # so unrelated jobs still run — but OTA's drift check will catch mismatches.
  - 'REQ_NODE="$(cat .nvmrc 2>/dev/null | tr -d " \n")"; PINNED_BIN="$HOME/.nvm/versions/node/v${REQ_NODE}/bin"; if [ -n "$REQ_NODE" ] && [ -x "$PINNED_BIN/node" ]; then export PATH="$PINNED_BIN:$PATH"; else NVM_BIN="$(ls -d "$HOME"/.nvm/versions/node/v22*/bin 2>/dev/null | sort -V | tail -1)"; export PATH="${NVM_BIN:+${NVM_BIN}:}$PATH"; echo "WARN: pinned Node v${REQ_NODE} not installed on this runner; using $(node -v 2>/dev/null || echo none)"; fi'
  - 'command -v node >/dev/null 2>&1 || { echo "Node 22 not found; run nvm install 22"; exit 1; }'

  - node -v
  - npm -v
  - python3 --version
  - which python3
  - ruby -v
  - echo "ANDROID_HOME=$ANDROID_HOME"
  - echo "PATH=$PATH"


###############################################################
# QUALITY — ESLint + TypeScript + architecture check on every MR
# Mirrors the local pre-commit gate: npm run check
# Fails the pipeline before any build starts if standards are violated.
###############################################################

code_quality:
  stage: quality
  tags: [mac-mini-runner]
  interruptible: true
  variables:
    SKIP_SKIA_DOWNLOAD: "1"
  before_script: []
  rules:
    - if: $CI_MERGE_REQUEST_ID
  script:
    - |
      set -eo pipefail
      node -v && npm -v
      npm ci
      npm run check

###############################################################
# ANDROID — MR builds APK
###############################################################

android_apk:
  stage: build
  tags: [mac-mobile-runner]
  interruptible: true
  # Cold builds take up to ~58 min alone and hit 90 min on 29 Oct with other pipelines on this runner.
  timeout: 2h
  variables:
    # CI APKs get shared for testing, so also build for 32-bit phones.
    # Gradle reads ORG_GRADLE_PROJECT_* as a project property, ahead of
    # android/gradle.properties (arm64-v8a only, for debug builds).
    ORG_GRADLE_PROJECT_reactNativeArchitectures: "armeabi-v7a,arm64-v8a"
  needs:
    - job: code_quality
      optional: true
  parallel:
    matrix:
      - APP_FLAVOR: global
      - APP_FLAVOR: cn
  # MR-only; skip any flavor whose CI/CD secrets are unset (keeps the
  # pipeline green when only one flavor's secrets are configured).
  rules:
    - if: '$CI_MERGE_REQUEST_ID && $APP_FLAVOR == "global" && $FS_KEYSTORE_GLOBAL_FILE'
    - if: '$CI_MERGE_REQUEST_ID && $APP_FLAVOR == "cn" && $FS_KEYSTORE_CN_FILE'
    - when: never
  script:
    - !reference [.select_deployment, script]
    - !reference [.env_tools, script]
    - npm ci
    # Secure Files: .env.<flavor> (optional, falls back to .env.<flavor>.example)
    # and google-services.json (global only). CI var: FS_KEYSTORE_<FLAVOR>_FILE
    # (base64 keystore). keystore.properties via prebuild.
    - |
      set -euo pipefail
      FLAVOR_UPPER=$(echo "${APP_FLAVOR}" | tr '[:lower:]' '[:upper:]')
      KEYSTORE_SECRET_VAR="FS_KEYSTORE_${FLAVOR_UPPER}_FILE"
      KEYSTORE_PATH="release.${APP_FLAVOR}.keystore"

      KEYSTORE_B64="${!KEYSTORE_SECRET_VAR:-}"
      [ -n "${KEYSTORE_B64}" ] || { echo "${KEYSTORE_SECRET_VAR} is not set"; exit 1; }

      download_secure_files

      if [ "${APP_FLAVOR}" = "global" ] && [ ! -f .secure_files/google-services.json ]; then
        echo "ERROR: Secure File google-services.json not found"
        exit 1
      fi

      umask 077
      mkdir -p android/app

      printf '%s' "${KEYSTORE_B64}" | base64 -d > "android/app/${KEYSTORE_PATH}"
      if [ "${APP_FLAVOR}" = "global" ]; then
        cp .secure_files/google-services.json android/app/google-services.json
      fi

      test -s "android/app/${KEYSTORE_PATH}"
      if [ "${APP_FLAVOR}" = "global" ]; then
        test -s android/app/google-services.json
      fi

    - |
      resolve_ci_env "${APP_FLAVOR}"
      inject_active_sdk ".env.${APP_FLAVOR}"
      cp ".env.${APP_FLAVOR}" .env

    - npm run "prebuild:android:${APP_FLAVOR}"

    - if [ -z "${ANDROID_HOME:-}" ]; then echo "ANDROID_HOME is not set (configure it as a GitLab CI variable or runner env)"; exit 1; fi
    - echo "sdk.dir=${ANDROID_HOME}" > android/local.properties
    - rm -rf /tmp/metro-* "${TMPDIR:-/tmp}/metro-"* "${TMPDIR:-/tmp}/haste-map-"* 2>/dev/null || true
    - cd android/fastlane
    - bundle install
    - bundle exec fastlane android apk flavor:${APP_FLAVOR}

    # Archive the Hermes source map (see docs/CRASH_SYMBOLICATION.md); warn, never fail.
    - |
      cd "${CI_PROJECT_DIR}"
      MAP="android/app/build/generated/sourcemaps/react/${APP_FLAVOR}Release/index.android.bundle.map"
      # Stamp the version in, matching iOS. Crashlytics shows "6.0.1 (51)", so the
      # archived name is index.android.bundle.global.6.0.1-51.map and picking the
      # right map is just reading two numbers off the crash report. Prebuild has
      # already synced these from .env into gradle.properties by this point.
      APP_VER="$(grep -m1 '^APP_VERSION=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
      VER_CODE="$(grep -m1 '^ANDROID_VERSION_CODE=' android/gradle.properties | cut -d= -f2 | tr -d '[:space:]')"
      OUT="index.android.bundle.${APP_FLAVOR}.${APP_VER:-unknown}-${VER_CODE:-0}.map"
      if [ -f "${MAP}" ]; then
        mkdir -p artifacts/sourcemaps
        cp "${MAP}" "artifacts/sourcemaps/${OUT}"
        echo "Archived source map for ${APP_FLAVOR}: ${OUT}"
      else
        echo "WARNING: source map not found at ${MAP} — release crashes for this build cannot be symbolicated"
      fi

  artifacts:
    paths:
      - artifacts/android/
      - artifacts/sourcemaps/
    expire_in: 1 day

###############################################################
# IOS — MR builds IPA
###############################################################

ios_ipa:
  stage: build
  tags: [mac-mini-runner]
  interruptible: true
  # Hit the 1h default on 29 Oct with other pipelines on this runner.
  timeout: 2h
  before_script: []
  needs:
    - job: code_quality
      optional: true
  rules:
    - if: '$CI_MERGE_REQUEST_ID && $IOS_P12_PASSWORD && $XCODE_ORG_ID'
    - when: never
  script:
    - !reference [.select_deployment, script]
    - !reference [.env_tools, script]
    - |
      set -eo pipefail
      node -v && npm -v && xcodebuild -version && ruby -v


      IOS_RUNNER_ENV="${HOME}/.esp-rainmaker-ios-fastlane.env"
      if [ -f "${IOS_RUNNER_ENV}" ]; then
        set -a
        # shellcheck disable=SC1090
        source "${IOS_RUNNER_ENV}"
        set +a
        echo "Loaded mac-mini signing config from ${IOS_RUNNER_ENV}"
      else
        echo "ERROR: ${IOS_RUNNER_ENV} not found on mac-mini-runner (see ios/fastlane/README.md)"
        exit 1
      fi

      # Secrets — GitLab CI/CD Variables only (Settings → CI/CD → Variables)
      : "${PRIVATE_TOKEN:?must be set as a GitLab CI/CD variable (masked)}"
      : "${IOS_P12_PASSWORD:?must be set as a GitLab CI/CD variable (masked)}"
      : "${IOS_KEYCHAIN_PASSWORD:?must be set as a GitLab CI/CD variable (masked)}"
      : "${XCODE_ORG_ID:?must be set as a GitLab CI/CD variable (masked)}"

      # Non-secrets — mac-mini-runner file above (not GitLab CI/CD Variables)
      : "${IOS_CERTIFICATE_FILE:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_PROFILE_FILES:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_XCODE_TARGETS:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_BUNDLE_IDS:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_PROFILE_NAMES:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_SCHEME:?must be set in ${IOS_RUNNER_ENV}}"
      : "${IOS_OUTPUT_IPA_NAME:?must be set in ${IOS_RUNNER_ENV}}"

      echo "iOS signing: scheme=${IOS_SCHEME} cert=${IOS_CERTIFICATE_FILE} ipa=${IOS_OUTPUT_IPA_NAME}"

      echo "export NODE_BINARY=$(command -v node)" > ios/.xcode.env.local

      npm ci

      # Secure File .env.global when present; else .env.global.example.
      # Missing keys in the Secure File are filled from the committed example.
      resolve_ci_env global
      inject_active_sdk .env.global
      cp .env.global .env

      # Secure File GoogleService-Info-Global.plist — resolve_ci_env already
      # ran download_secure_files, so .secure_files/ is populated. Placed
      # before prebuild:ios so sync-env-to-ios.js sees the real plist and
      # skips the template fallback. Non-default filename is deliberate —
      # see ios/APP/AppDelegate.mm (keeps RNFB iOS auto-init off on CN).
      if [ ! -f .secure_files/GoogleService-Info-Global.plist ]; then
        echo "ERROR: Secure File GoogleService-Info-Global.plist not found"
        exit 1
      fi
      umask 077
      cp .secure_files/GoogleService-Info-Global.plist ios/APP/GoogleService-Info-Global.plist
      test -s ios/APP/GoogleService-Info-Global.plist
      plutil -lint ios/APP/GoogleService-Info-Global.plist

      npm run prebuild:ios

      cd ios/fastlane
      bundle install --jobs 4 --retry 3
      bundle exec fastlane ios adhoc

    # Resolves JS bundle offsets in Crashlytics back to file and line — see
    # docs/CRASH_SYMBOLICATION.md. Warn rather than fail: a missing map must not
    # break a build that produced a signed IPA.
    - |
      cd "${CI_PROJECT_DIR}"
      # ios/.xcode.env stamps the version in: main.jsbundle.<version>-<build>.map.
      # Glob so the name is not duplicated here; it also matches the old fixed name.
      MAP="$(ls -1t ios/build/main.jsbundle*.map 2>/dev/null | head -1)"
      if [ -n "${MAP}" ]; then
        mkdir -p artifacts/sourcemaps
        cp "${MAP}" "artifacts/sourcemaps/$(basename "${MAP}")"
        echo "Archived iOS source map: $(basename "${MAP}")"
      else
        echo "WARNING: no source map at ios/build/main.jsbundle*.map — release JS crashes for this build cannot be symbolicated"
      fi

  artifacts:
    paths:
      - artifacts/ios/
      - artifacts/sourcemaps/
    expire_in: 1 day

###############################################################
# SOURCE MAPS — republished alone so they can outlive the build.
# GitLab allows one expire_in per job, and a map is ~30 MB against a
# 150-280 MB APK, so keeping both together would pin the binaries too.
# Split per platform so an iOS failure still leaves the Android maps.
###############################################################

android_sourcemap:
  stage: archive
  tags: [mac-mobile-runner]
  interruptible: true
  before_script: []
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - when: never
  needs:
    - job: android_apk
      artifacts: true
  script:
    # mkdir first: the build only warns when no map was produced.
    - mkdir -p artifacts/sourcemaps
    - ls -lh artifacts/sourcemaps
  artifacts:
    paths:
      - artifacts/sourcemaps/
    expire_in: 30 days

ios_sourcemap:
  stage: archive
  tags: [mac-mini-runner]
  interruptible: true
  before_script: []
  rules:
    - if: '$CI_MERGE_REQUEST_ID'
    - when: never
  needs:
    - job: ios_ipa
      artifacts: true
  script:
    - mkdir -p artifacts/sourcemaps
    - ls -lh artifacts/sourcemaps
  artifacts:
    paths:
      - artifacts/sourcemaps/
    expire_in: 30 days

###############################################################
# DEVICE TESTS — one harness, parameterized per platform
###############################################################

# The workspace venv survives checkouts (GIT_CLEAN_FLAGS) and is rebuilt only
# when requirements.txt changes, so a run does not pay a fresh pip install.
.device_test:
  stage: test
  tags: [mac-mini-runner]
  # iOS regression already took 2h58 on 26 Oct, just under the old 3h.
  timeout: 4h
  variables:
    GIT_CLEAN_FLAGS: -ffdx -e test/.venv
  artifacts:
    when: always
    paths:
      - test/reports/
    expire_in: 1 day

.device_test_env:
  script:
    - !reference [.env_tools, script]
    - resolve_ci_env global

.device_test_run:
  script:
    - cd test
    - |
      REQUIREMENTS_SHA=$(shasum -a 256 requirements.txt | cut -d' ' -f1)
      if [ ! -x .venv/bin/python ] || [ "$(cat .venv/.requirements_sha 2>/dev/null)" != "${REQUIREMENTS_SHA}" ]; then
        rm -rf .venv
        python3 -m venv .venv
        . .venv/bin/activate
        python -m pip install -U pip
        pip install -r requirements.txt
        echo "${REQUIREMENTS_SHA}" > .venv/.requirements_sha
      else
        . .venv/bin/activate
        echo "Reusing test/.venv (requirements unchanged)"
      fi

    # Export non-secret test defaults (CI/CD variables and .env still take precedence), then generate config
    - . scripts/setup_test_env.sh
    # Parallel android+ios: one shared lock DB across the two job workspaces so acquire() atomically hands out disjoint chips (no ESP_EXCLUDE partitioning needed).
    - export ESP_LOCK_DB_PATH="${ESP_LOCK_DB_PATH:-$HOME/.esp_resource_locks.db}"
    - python scripts/ci_setup_config.py

    - MARKER="${MARKER:-sanity}"

    # Provisioning firmware bundles from Jenkins (set DOWNLOAD_FIRMWARES=y on
    # runs that include chip tests; needs JENKINS_USER/JENKINS_API_TOKEN vars).
    - if [ "${DOWNLOAD_FIRMWARES:-n}" = "y" ]; then python scripts/download_firmwares.py; fi

    # Run tests without aborting the job, so the MR comment is always posted.
    # The report email (incl. GITLAB_USER_EMAIL pipeline triggerer) is sent by
    # the pytest report plugin at session finish.
    - |
      set +e
      python -m pytest \
        --model "${TEST_MODEL}" \
        -m "${MARKER}" \
        --deployment "${DEPLOYMENT}" \
        --tb=short \
        --disable-warnings \
        -v
      TEST_EXIT=$?
      set -e

    # Comment on the triggering MR with the report link (needs GITLAB_MR_TOKEN
    # CI variable: project access token with `api` scope).
    - python scripts/notify_mr.py || true

    - |
      STATUS=$(python -c "import json;print(json.load(open('reports/last_run_summary.json'))['status'])" 2>/dev/null || true)
      echo "Run status: ${STATUS:-<none>} (pytest exit ${TEST_EXIT})"
      case "$STATUS" in
        "ALL PASSED"|"MOSTLY PASSED") exit 0 ;;
        *) exit "${TEST_EXIT}" ;;
      esac

android_test:
  extends: .device_test
  resource_group: android_moto
  # Release MRs test both deployments in android_test_release instead.
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/v/'
      when: never
    - if: '$CI_MERGE_REQUEST_ID && $FS_KEYSTORE_GLOBAL_FILE'
    - when: never
  needs:
    - job: "android_apk: [global]"
      artifacts: true
      optional: true
  script:
    - set -euo pipefail
    - !reference [.select_deployment, script]
    - APK_PATH="${CI_PROJECT_DIR}/artifacts/android/app-global-release.apk"
    - if [ ! -f "${APK_PATH}" ]; then echo "APK not found at ${APK_PATH}"; ls -la artifacts/android || true; exit 1; fi
    - echo "APK_PATH=${APK_PATH}"
    - !reference [.device_test_env, script]
    - mkdir -p test/artifacts/android
    - cp "${APK_PATH}" test/artifacts/android/app-release.apk
    - ls -la test/artifacts/android
    - TEST_MODEL="${MODEL:-motorola edge 60 pro}"
    - !reference [.device_test_run, script]

ios_test:
  extends: .device_test
  resource_group: iphone_air
  before_script: []
  # Release MRs test both deployments in ios_test_release instead.
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/v/'
      when: never
    - if: '$CI_MERGE_REQUEST_ID && $IOS_P12_PASSWORD && $XCODE_ORG_ID'
    - when: never
  needs:
    - job: ios_ipa
      artifacts: true
      optional: true
  script:
    - set -euo pipefail
    - !reference [.select_deployment, script]
    - command -v appium >/dev/null || { echo "appium not found (npm i -g appium)"; exit 1; }
    - IPA_PATH=$(ls "${CI_PROJECT_DIR}"/artifacts/ios/*.ipa 2>/dev/null | head -1)
    - if [ -z "${IPA_PATH}" ]; then echo "IPA not found under artifacts/ios"; ls -la artifacts/ios || true; exit 1; fi
    - echo "IPA_PATH=${IPA_PATH}"
    - !reference [.device_test_env, script]
    - mkdir -p test/artifacts/ios
    - cp "${IPA_PATH}" test/artifacts/ios/app-release.ipa
    - TEST_MODEL="${IOS_MODEL:-iPhone Air}"
    # WebDriverAgent is built fresh from the Apple account signed in to Xcode on
    # this runner (no prebuilt-WDA bootstrap).
    - !reference [.device_test_run, script]

# Release MRs: full regression on both deployments from the same build. The
# matrix values win over the commit-message pick in .select_deployment; the two
# jobs share the phone's resource_group, so they run one after the other.
.both_deployments:
  parallel:
    matrix:
      - DEPLOYMENT: rm
        ACTIVE_SDK: rainmaker-matter-sdk
      - DEPLOYMENT: rmneo
        ACTIVE_SDK: rainmaker-neo-matter-sdk

android_test_release:
  extends: [android_test, .both_deployments]
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/v/ && $CI_MERGE_REQUEST_ID && $FS_KEYSTORE_GLOBAL_FILE'
    - when: never

ios_test_release:
  extends: [ios_test, .both_deployments]
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME =~ /^release\/v/ && $CI_MERGE_REQUEST_ID && $IOS_P12_PASSWORD && $XCODE_ORG_ID'
    - when: never

# OTA publish — see deployment/ota/README.md for the flow, trigger model, and rotation.
.ota_publish:
  stage: deploy
  tags: [mac-mini-runner]
  needs: []
  before_script:
    - export PATH="/usr/local/opt/python@3.10/libexec/bin:/usr/local/bin:/opt/homebrew/bin:$PATH"
    # Honor .nvmrc so the runner uses the exact Node the repo pins. Falls back
    # to the latest installed v22 if the pinned version isn't on the runner,
    # so unrelated jobs still run — but OTA's drift check will catch mismatches.
    - 'REQ_NODE="$(cat .nvmrc 2>/dev/null | tr -d " \n")"; PINNED_BIN="$HOME/.nvm/versions/node/v${REQ_NODE}/bin"; if [ -n "$REQ_NODE" ] && [ -x "$PINNED_BIN/node" ]; then export PATH="$PINNED_BIN:$PATH"; else NVM_BIN="$(ls -d "$HOME"/.nvm/versions/node/v22*/bin 2>/dev/null | sort -V | tail -1)"; export PATH="${NVM_BIN:+${NVM_BIN}:}$PATH"; echo "WARN: pinned Node v${REQ_NODE} not installed on this runner; using $(node -v 2>/dev/null || echo none)"; fi'
    - |
      if ! command -v aws >/dev/null 2>&1; then
        echo "AWS CLI not on PATH; installing via brew..."
        brew install awscli
      fi
    - node -v && npm -v && aws --version
  rules:
    # OTA publishes go straight to the live production bucket + CloudFront —
    # no staging separation — so there is intentionally no manual trigger from
    # MR pipelines: a stray click would push an in-progress bundle to devices.
    # The only path that publishes is a merge to release/*.
    #
    # Skip release/* auto-publish if any native surface changed: a JS-only
    # OTA published for a new fingerprint has no in-wild binary to apply to.
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
      changes:
        paths:
          - "ios/**"
          - "android/**"
          - "fingerprint.config.js"
          - "app.config.ts"
          - "deployment/ota/certs/certificate.pem"
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^release\/.*/
  script:
    - !reference [.env_tools, script]
    - !reference [.ota_signing_key, script]
    - |
      set -euo pipefail
      : "${AWS_ACCESS_KEY_ID:?must be set as a GitLab CI/CD variable}"
      : "${AWS_SECRET_ACCESS_KEY:?must be set as a GitLab CI/CD variable}"
      : "${AWS_REGION:?must be set as a GitLab CI/CD variable}"
      : "${APP_ASSETS_S3_BUCKET:?must be set as a GitLab CI/CD variable}"
      : "${CLOUDFRONT_DISTRIBUTION_ID:?must be set as a GitLab CI/CD variable}"
      : "${APP_ASSETS_URL:?must be set as a GitLab CI/CD variable}"

      # Use Secure File .env.<region> when present (falls back to .env.<region>.example)
      # so the fingerprint here matches the one the dev computed against the same
      # env — otherwise `sync-runtime-version.js --check` drifts on release cuts.
      resolve_ci_env "${OTA_REGION}"
      npm ci

      # Regenerate native config from the Secure Files env and fail if the
      # committed files drift — catches Secure Files updates that didn't come
      # with a matching native-file commit.
      cp ".env.${OTA_REGION}" .env
      npm run "prebuild:${OTA_PLATFORM}"
      if ! git diff --exit-code --quiet; then
        echo "ERROR: committed native files drifted vs. current Secure Files .env.${OTA_REGION}."
        echo "Changed files:"
        git diff --name-only
        echo ""
        echo "Fix: on a dev machine, run"
        echo "  npm run env:pull:${OTA_REGION} && cp .env.${OTA_REGION} .env"
        echo "  npm run prebuild:${OTA_PLATFORM}"
        echo "  node deployment/ota/scripts/sync-runtime-version.js --platform ${OTA_PLATFORM}"
        echo "then commit the result and re-cut the release."
        exit 1
      fi

      # OTA_VERSION from package.json's versionCode (see deployment/ota/README.md).
      OTA_VERSION=$(node -p "require('./package.json').versionCode")
      case "$OTA_VERSION" in
        ''|*[!0-9]*)
          echo "ERROR: package.json versionCode is not a positive integer: '$OTA_VERSION'"
          exit 1
          ;;
      esac
      echo "OTA_VERSION=${OTA_VERSION}"

      # Drift checks — fail fast on stale native runtime version or cert.
      node deployment/ota/scripts/sync-runtime-version.js --check --platform "$OTA_PLATFORM"
      node deployment/ota/scripts/sync-signing-cert.js --check --platform "$OTA_PLATFORM"

      OTA_FINGERPRINT=$(node deployment/ota/scripts/sync-runtime-version.js --print --platform "$OTA_PLATFORM")
      echo "OTA_FINGERPRINT=${OTA_FINGERPRINT}"

      npx expo export --platform "${OTA_PLATFORM}" --output-dir dist-ota

      HOST="${APP_ASSETS_URL#https://}"
      HOST="${HOST#http://}"
      HOST="${HOST%/}"
      BASE_URL="https://${HOST}/ota/prod/${OTA_REGION}/${OTA_PLATFORM}/${OTA_FINGERPRINT}/${OTA_VERSION}"
      node deployment/ota/scripts/build-manifest.js "$BASE_URL" "$OTA_PLATFORM"

      node deployment/ota/scripts/publish.js --region "$OTA_REGION" --platform "$OTA_PLATFORM" --version "$OTA_VERSION"
      node deployment/ota/scripts/promote.js --region "$OTA_REGION" --platform "$OTA_PLATFORM" --version "$OTA_VERSION"

      # Sanity check — direct fingerprint URL (client-facing flat URL works
      # only after the CloudFront routing function is deployed).
      echo ""
      echo "=== Verifying published manifest ==="
      curl -sI "https://${HOST}/ota/prod/${OTA_REGION}/${OTA_PLATFORM}/${OTA_FINGERPRINT}/latest/manifest.json" | head -10

ota_publish_global_ios:
  extends: .ota_publish
  variables:
    OTA_REGION: global
    OTA_PLATFORM: ios

ota_publish_global_android:
  extends: .ota_publish
  variables:
    OTA_REGION: global
    OTA_PLATFORM: android

# CN Android OTA. Same bucket / CloudFront / APP_ASSETS_URL as global;
# OTA_REGION=cn routes to the /ota/prod/cn/ prefix. iOS stays global-only
# (single binary resolves region at runtime).
ota_publish_cn_android:
  extends: .ota_publish
  variables:
    OTA_REGION: cn
    OTA_PLATFORM: android

###############################################################
# WEB — release/* branches (manual): build Expo web export →
#   s3://$APP_ASSETS_S3_BUCKET/web/<env>/<region>/<version>/
#   + latest/manifest.json, history.jsonl, version-meta, web/version-manifest.json
#   + local tracking via deployment/web/cdn.yaml (created from example in the job)
# CI/CD variables: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, [AWS_SESSION_TOKEN],
# AWS_REGION, APP_ASSETS_S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID, APP_ASSETS_URL
# Secure Files: .env.web
# Optional: WEB_DEPLOY_ENV (prod), WEB_DEPLOY_REGION (global|cn), WEB_DEPLOY_VERSION
#
# Trigger: push to release/* → play web_deploy manually after code_quality
###############################################################

web_deploy:
  stage: deploy
  tags: [mac-mini-runner]
  interruptible: false
  # Runs take about an hour on this runner, right at the 1h default (two timed out on 29 Oct).
  timeout: 2h
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^release\// && $AWS_ACCESS_KEY_ID && $APP_ASSETS_S3_BUCKET && $CLOUDFRONT_DISTRIBUTION_ID'
      when: manual
    - when: never
  needs:
    - job: code_quality
      optional: true
  script:
    - !reference [.env_tools, script]
    - !reference [.aws_web_credentials, script]
    - |
      set -euo pipefail
      : "${APP_ASSETS_S3_BUCKET:?Set APP_ASSETS_S3_BUCKET in CI/CD variables}"
      : "${CLOUDFRONT_DISTRIBUTION_ID:?Set CLOUDFRONT_DISTRIBUTION_ID in CI/CD variables}"
      download_secure_files
      export APP_ASSETS_S3_BUCKET CLOUDFRONT_DISTRIBUTION_ID
      if [ -n "${APP_ASSETS_URL:-}" ]; then
        export APP_ASSETS_URL
      fi
      if [ -n "${WEB_DEPLOY_ENV:-}" ]; then
        export WEB_DEPLOY_ENV
      fi
      if [ -n "${WEB_DEPLOY_REGION:-}" ]; then
        export WEB_DEPLOY_REGION
      fi
      if [ -n "${WEB_DEPLOY_VERSION:-}" ]; then
        export WEB_DEPLOY_VERSION
      fi
    - ./deployment/web/scripts/deploy-web.sh
