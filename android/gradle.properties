# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# Default value: -Xmx512m -XX:MaxMetaspaceSize=256m
# R8 (release minification) is memory-heavy for large RN/Expo graphs; raise heap and cap R8 workers.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
android.r8.maxWorkers=2

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# Release buildType: AAPT PNG crunch.
android.enablePngCrunchInReleaseBuilds=true

# Global AAPT2 cruncher.
android.enableAaptPngCrunch=true

# Release-only resource shrinking.
android.enableShrinkResourcesInReleaseBuilds=true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
# reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

reactNativeArchitectures=arm64-v8a

# New Architecture flag - always-on in RN 0.83+, but many third-party
# libraries still gate their codegen plugin on this property.
newArchEnabled=true

# Hermes engine flag - Hermes is the default and only supported JS engine
# in RN 0.83+, but several third-party libraries (e.g. react-native-worklets)
# still read this property at configure time and fail without it.
hermesEnabled=true

# Enable GIF support in React Native images (~200 B increase)
expo.gif.enabled=true
# Enable webp support in React Native images (~85 KB increase)
expo.webp.enabled=true
# Enable animated webp support (~3.4 MB increase)
# Disabled by default because iOS doesn't support animated webp
expo.webp.animated=false

# Enable network inspector
EX_DEV_CLIENT_NETWORK_INSPECTOR=true

# Use legacy packaging to compress native libraries in the resulting APK.
expo.useLegacyPackaging=false



org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.configureondemand=false
org.gradle.caching=true

kotlin.incremental=true
kotlin.incremental.android=true

# ============================================================================
# CONFIGURATION-DRIVEN ANDROID BUILD PROPERTIES
# ============================================================================
# These properties are synced from .env file
# Do not manually edit these values - update .env instead
# ============================================================================

# App Identity & Branding
APP_NAME=ESP RainMaker Home
ANDROID_APP_APPLICATION_ID=com.espressif.novahome

# Version Information
APP_VERSION=5.4.0
ANDROID_VERSION_CODE=48

# Deep Link & URL Schemes
AGENTS_DEEP_LINK_SCHEME=rainmaker
AGENTS_DEEP_LINK_HOST=agents.espressif.com
AGENTS_DEEP_LINK_PATH_PREFIX=/try/agents

# OAuth Configuration
THIRD_PARTY_AUTH_REDIRECT_SCHEME=rainmaker
THIRD_PARTY_AUTH_REDIRECT_HOST=com.espressif.novahome
THIRD_PARTY_AUTH_REDIRECT_URL=rainmaker://com.espressif.novahome/success

# Matter Configuration
MATTER_VENDOR_ID=0x131B
# Matter commissioning back-end (ChipTool | GooglePlayServices). Default: GooglePlayServices.
MATTER_COMMISSIONING_METHOD=GooglePlayServices

# Notification Configuration
APP_NOTIFICATION_DEFAULT_TITLE=ESP RainMaker
APP_NOTIFICATION_DEFAULT_BODY=New notification

APP_REGION=auto

# WeChat login (CN flavor only). Drives the WeChat native module's BuildConfig
# field and the WXEntryActivity URL scheme. Do NOT hardcode the App ID here —
# it is populated from WECHAT_APP_ID in .env by scripts/sync-env-to-android.js.
WECHAT_APP_ID=wx9d48fe3e583d36ab
